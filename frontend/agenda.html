<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agenda</title>
<link rel="stylesheet" href="/static/agenda.css">
</head>

<body>

<div class="app">

  <div class="container">

    <h2 class="titulo">AGENDA</h2>
    <p class="subtitulo">Acompanhe seus agendamentos</p>
    <div class="field">
  <label for="mes">Filtrar por mês</label>

  <select id="mes" onchange="renderizar()">
    <option value="1">Janeiro</option>
    <option value="2">Fevereiro</option>
    <option value="3">Março</option>
    <option value="4">Abril</option>
    <option value="5">Maio</option>
    <option value="6">Junho</option>
    <option value="7">Julho</option>
    <option value="8">Agosto</option>
    <option value="9">Setembro</option>
    <option value="10">Outubro</option>
    <option value="11">Novembro</option>
    <option value="12">Dezembro</option>
  </select>
</div>

    <!-- LISTA -->
    <div id="lista"></div>

    <!-- BOTÃO -->
    <button class="btn-voltar" onclick="window.location.href='/admin/home'">
  Voltar
</button>

  </div>

</div>

<!-- MODAL -->
<div class="modal" id="modal">

  <div class="modal-box">
    <p>Deseja excluir esse agendamento?</p>

    <div class="modal-actions">

      <button onclick="confirmarExclusao()">Sim</button>
      <button onclick="fecharModal()">Não</button>
    </div>
  </div>
</div>

<script src="/static/agenda.js"></script>

</body>
</html>
