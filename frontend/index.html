<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- PWA -->
  <link rel="manifest" href="/static/manifest.json">
  <meta name="theme-color" content="#16a34a">

  <!-- CSS -->
  <link rel="stylesheet" href="/static/styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

</head>

<body>

<div class="app">

  <div class="header">
    <img 
      src="/static/imagem/logo.png" 
      alt="Logo RF Clean"
      id="logo-admin"
    >
  </div>

  <div class="content">
    <h2>Escolha um serviço</h2>
    <p>Selecione uma opção para continuar</p>

    <!-- CARD VEÍCULO -->
    <div class="card" onclick="irParaVeiculo()">
      <div class="card-left">

        <div class="icon-box">
          <img src="/static/imagem/carro.png" alt="Carro">
        </div>

        <span>Veículo</span>
      </div>
      <span class="arrow">›</span>
    </div>

    <!-- CARD ESTOFADO -->
    <div class="card" onclick="irParaEstofado()">
      <div class="card-left">

        <div class="icon-box">
          <img src="/static/imagem/sofa.png" alt="Sofá">
        </div>

        <span>Estofado</span>
      </div>
      <span class="arrow">›</span>
    </div>

    <div class="footer">
      <p>Nos siga no Instagram</p>

      <a href="https://www.instagram.com/rf_clean.higienizacao" target="_blank" class="insta-link">
        <i class="fab fa-instagram"></i>
        <span>@rf_clean.higienizacao</span>
      </a>
    </div>

    <div class="creditos">
      Criado por <strong>WendelTech</strong>
    </div>

  </div>
</div>

<!-- JS -->
<script src="/static/app.js"></script>

<!-- PWA -->
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/static/sw.js')
    .then(() => console.log('PWA funcionando'))
    .catch(err => console.log('Erro SW:', err))
}
</script>

</body>
</html>
